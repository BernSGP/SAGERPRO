
name: Publish SAGERPRO and refresh education updates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sagerpro-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect education news
        if: github.event_name != 'push'
        run: python scripts/update_news.py

      - name: Save collected news
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh education news"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html article.html styles.css script.js favicon.svg robots.txt sitemap.xml _site/
          cp -R data _site/data
          if [ -d images ]; then cp -R images _site/images; fi
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
